version: '3.8'

services:
  avatars-placeholder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avatars-placeholder
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MODE=prod
      # Image Configuration
      - IMG_START_INDEX=1
      - IMG_END_INDEX=100
      - IMG_BOY_START_INDEX=1
      - IMG_BOY_END_INDEX=50
      - IMG_GIRL_START_INDEX=51
      - IMG_GIRL_END_INDEX=100
      # Avatar Configuration
      - AVATAR_PUBLIC_NAME=AV
      - AVATAR_FORAMT_FILE=.png
      - UPLOAD_DIR=images
      - AVATAR_404=AV404.png
      # Jobs Configuration
      - JOBS_LIST=astronomer,chef,designer,doctor,farmer,firefighters,lawyer,operator,police,teacher
    volumes:
      # Mount images directory for easy updates without rebuilding
      - ./back-end/images:/app/images:ro
      - ./back-end/static:/app/static:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - proxy-network

  # Development service with hot reload
  avatars-placeholder-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: avatars-placeholder-dev
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MODE=dev
      # Image Configuration
      - IMG_START_INDEX=1
      - IMG_END_INDEX=100
      - IMG_BOY_START_INDEX=1
      - IMG_BOY_END_INDEX=50
      - IMG_GIRL_START_INDEX=51
      - IMG_GIRL_END_INDEX=100
      # Avatar Configuration
      - AVATAR_PUBLIC_NAME=AV
      - AVATAR_FORAMT_FILE=.png
      - UPLOAD_DIR=images
      - AVATAR_404=AV404.png
      # Jobs Configuration
      - JOBS_LIST=astronomer,chef,designer,doctor,farmer,firefighters,lawyer,operator,police,teacher
    volumes:
      - ./back-end:/app
      - /app/node_modules
    restart: unless-stopped
    profiles:
      - dev
    networks:
      - proxy-network

networks:
  proxy-network:
    driver: bridge 
    # external: true